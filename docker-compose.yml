services:
  robot-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: robot-simulator:latest
    container_name: robot-simulator
    ports:
      - "5000:5000"
    environment:
      FLASK_DEBUG: "0"
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/state', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
